<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | banû</title>
    <link rel="icon" type="image/png" href="Images/banuFavicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-link">
                <img src="Images/banuText.png" alt="banû logo" class="logo-img">
            </a>
            <nav class="nav-links">
                <a href="index.html">Overview</a>
                <a href="platform.html">Platform</a>
                <a href="innovations.html">Innovations</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
        </div>
    </header>

    <main class="page-header">
        <div class="container">
            <div class="contact-box">
                <h2>Partner with banû</h2>
                <p style="color: #94a3b8; margin-bottom: 2rem;">Connect with our clinical integration and engineering teams to deploy next-generation health intelligence.</p>
                <form id="inquiry-form">
                    <input type="text" id="inquirer-name" placeholder="Name / Institution" required>
                    <input type="email" id="inquirer-email" placeholder="Professional Email" required>
                    <button type="submit" class="btn btn-primary">Submit Inquiry</button>
                </form>
                <div id="form-feedback" class="hidden"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container footer-content">
            <img src="Images/banuText.png" alt="banû logo" class="footer-logo">
            <p>&copy; 2026 banû Technologies Inc. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
